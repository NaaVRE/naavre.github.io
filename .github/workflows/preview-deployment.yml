name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

env:
  SITE_BASE_URL: naavre.net
  PR_PREVIEW_DIR: pr-preview

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set BASE_URL
        run: echo "BASE_URL=${{ env.SITE_BASE_URL }}/${{ env.PR_PREVIEW_DIR }}/${{ github.event.number }}/" >> $GITHUB_ENV

      - name: Install and Build
        if: github.event.action != 'closed'
        run: |
          npm install
          npm run build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build
          pages-base-url: ${{ env.SITE_BASE_URL }}
          umbrella-dir: ${{ env.PR_PREVIEW_DIR }}
          pages-base-path: docs
